services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kubeorchestrator-api
    ports:
      - "5024:8080" 
    env_file:
      - .env
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_cache:
        condition: service_started
    networks:
      - kube-net

  mysql_db:
    image: mysql:8.0
    container_name: kubeorchestrator-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
      MYSQL_USER: ${MYSQL_DB_USER}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD}
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - kube-net
  redis_cache:
    image: redis:alpine
    container_name: kubeorchestrator-redis
    restart: always
    ports:
      - "6380:6379"
    networks:
      - kube-net
  phpmyadmin:
    image: phpmyadmin:5.2.0
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - kube-net
    depends_on:
      - mysql_db

networks:
  kube-net:
    driver: bridge

volumes:
  mysql_data: